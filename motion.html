  <link rel="stylesheet" href="css/style.css" />
  <style>
    .motion-hero {
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px;
      position: relative;
    }

    .motion-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.11);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
      border-radius: 9999px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 32px;
      animation: fadeUp 0.6s ease both;
    }

    .motion-eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50%       { opacity: 0.9;  transform: scale(1.3); }
    }

    .motion-title {
      font-size: 72px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: 20px;
      animation: fadeUp 0.7s ease 0.08s both;
    }

    .motion-title-main {
      color: #ffffff;
      display: block;
    }

    .motion-title-word {
      display: block;
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 45%, #cbd5e1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-style: italic;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4)) drop-shadow(0 0 1px rgba(255,255,255,0.1));
    }

    .motion-desc {
      font-size: 17px;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.65;
      max-width: 440px;
      margin-bottom: 40px;
      animation: fadeUp 0.7s ease 0.16s both;
    }

    .motion-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      box-shadow: 0 2px 16px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: -0.01em;
      animation: fadeUp 0.7s ease 0.24s both;
    }

    .motion-badge svg {
      opacity: 0.5;
    }

    @media (max-width: 600px) {
      .motion-title { font-size: 44px; }
    }
  </style>
</head>

      Motion graphics, animated overlays, and premium video assets for Minecraft creators. Something's in the works.
